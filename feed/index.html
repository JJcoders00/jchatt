<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jchatt - Premium</title>
    <link rel="icon" type="image/png" href="../icon-192.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="theme-dark feed-body"> 
    <div class="app-container" id="appContainer">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <header class="header blur-header">
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=User&background=random" id="currentUserAvatar" alt="Profile" class="avatar">
                    <span id="currentUserName" class="current-user-name">Loading...</span>
                </div>
                <div class="header-actions">
                    <button id="settingsBtn" title="Theme Settings"><i class="fas fa-palette"></i></button>
                    <button id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>
            
            <div class="search-container">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search chats...">
                </div>
                <button id="newChatBtn" class="primary-fab" title="New Chat"><i class="fas fa-plus"></i></button>
            </div>
            
            <div class="chat-list" id="chatList">
                <div class="chat-list-empty">Loading your chats...</div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <div class="chat-area-blank" id="chatBlankState">
                <div class="blank-content glass-card">
                    <div class="logo-animation">
                        <img src="/icon-512.png" alt="Logo" class="install-app-icon" style="width: 100px; height: 100px;">
                    </div>
                    <h2>Welcome to Jchatt</h2>
                    <p>Select a conversation or start a new one to begin connecting globally.</p>
                </div>
            </div>

            <div class="active-chat-container" id="activeChat" style="display: none;">
                <header class="header blur-header chat-header">
                    <div class="chat-header-info">
                        <button id="backBtn" class="mobile-only action-btn"><i class="fas fa-arrow-left"></i></button>
                        <img src="" id="chatHeaderAvatar" alt="Profile" class="avatar">
                        <div class="chat-header-text">
                            <span id="chatHeaderName" class="current-user-name">User</span>
                            <span class="online-status">Online</span>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button id="audioCallBtn" class="action-btn" title="Voice Call"><i class="fas fa-phone"></i></button>
                        <button id="videoCallBtn" class="action-btn" title="Video Call"><i class="fas fa-video"></i></button>
                    </div>
                </header>
                
                <div class="messages-wrapper" id="messagesWrapper">
                    <div class="messages-container" id="messagesContainer">
                        <!-- Messages render here -->
                    </div>
                    <div id="typingIndicator" class="typing-indicator" style="display: none;">typing...</div>
                </div>
                
                <footer class="chat-footer blur-footer">
                    <!-- Image Preview -->
                    <div id="mediaPreviewContainer" class="media-preview-container" style="display: none;">
                        <img id="mediaPreviewImg" src="" alt="Preview">
                        <button type="button" id="removeMediaBtn"><i class="fas fa-times"></i></button>
                    </div>

                    <!-- Reply Preview -->
                    <div id="replyPreview" class="reply-preview" style="display: none;">
                        <div class="reply-preview-content">
                            <i class="fas fa-reply"></i>
                            <span id="replyPreviewText"></span>
                        </div>
                        <button type="button" id="cancelReply" class="reply-cancel"><i class="fas fa-times"></i></button>
                    </div>
                    
                    <form id="messageForm" class="message-form">
                        <input type="file" id="mediaInput" accept="image/*" style="display: none;">
                        <button type="button" id="attachBtn" class="action-btn" title="Photo">
                            <i class="fas fa-image"></i>
                        </button>
                        
                        <div class="input-wrapper">
                            <textarea id="messageInput" placeholder="Message..." rows="1"></textarea>
                        </div>

                        <!-- Emoji -->
                        <button type="button" id="emojiBtn" class="action-btn" title="Emoji">
                            <i class="fas fa-face-smile"></i>
                        </button>
                        <div id="emojiPicker" class="emoji-picker"></div>
                        
                        <button type="submit" id="sendBtn" class="action-btn send-btn" title="Send">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </footer>
            </div>
        </div>
    </div>
    
    <!-- New Chat Modal -->
    <div class="modal" id="newChatModal">
        <div class="modal-content glass-card">
            <h3>Start a Conversation</h3>
            <p class="modal-subtitle">Connect instantly via email.</p>
            <div class="input-group">
                <label for="newChatEmail">Email Address</label>
                <input type="email" id="newChatEmail" placeholder="e.g. hello@jchatt.com">
            </div>
            <div id="newChatError" class="error-msg"></div>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelNewChatBtn" style="padding: 12px 24px; border-radius: 12px;">Cancel</button>
                <button class="btn-primary" id="startNewChatBtn" style="padding: 12px 24px; border-radius: 12px;">Start Chat</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content glass-card">
            <h3>Appearance</h3>
            <p class="modal-subtitle">Customize your experience.</p>
            
            <div class="settings-group">
                <label>Theme</label>
                <select id="themeSelect" class="form-select">
                    <option value="theme-dark">Pro Dark (Default)</option>
                    <option value="theme-light">Clean Light</option>
                    <option value="theme-midnight">Midnight Blue</option>
                </select>
            </div>
            
            <div class="settings-group">
                <label>Accent Color</label>
                <div class="color-picker-group" id="colorPickerGroup">
                    <div class="color-circle" data-color="#6366f1" style="background:#6366f1;"></div>
                    <div class="color-circle" data-color="#10b981" style="background:#10b981;"></div>
                    <div class="color-circle" data-color="#f43f5e" style="background:#f43f5e;"></div>
                    <div class="color-circle" data-color="#8b5cf6" style="background:#8b5cf6;"></div>
                    <div class="color-circle" data-color="#f59e0b" style="background:#f59e0b;"></div>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" id="closeSettingsBtn" style="width: 100%;">Done</button>
            </div>
        </div>
    </div>

    <!-- Video Call UI -->
    <div id="videoCallWrapper" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #050505; z-index: 1000;">
        <video id="remoteVideo" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; background: #0a0a0a;"></video>
        <video id="localVideo" autoplay playsinline muted style="position: absolute; bottom: 110px; right: 20px; width: 120px; height: 160px; object-fit: cover; border-radius: 0.75rem; border: 2px solid #10b981; transform: scaleX(-1);"></video>
        <div id="callStatusText" style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; color: white; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 10;">Calling...</div>
        
        <div style="position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10;">
            <button id="toggleAudioBtn" class="action-btn" style="background: rgba(30,30,30,0.8); color: white; width: 56px; height: 56px; border-radius: 50%;"><i class="fas fa-microphone"></i></button>
            <button id="toggleVideoBtn" class="action-btn" style="background: rgba(30,30,30,0.8); color: white; width: 56px; height: 56px; border-radius: 50%;"><i class="fas fa-video"></i></button>
            <button id="endCallBtn" class="action-btn" style="background: #ef4444; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fas fa-phone-slash fa-lg"></i></button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div class="modal" id="incomingCallModal">
        <div class="modal-content glass-card" style="text-align: center;">
            <img id="incomingCallAvatar" src="" class="avatar" style="width: 80px; height: 80px; margin: 0 auto 15px auto;">
            <h3 id="incomingCallName">Someone</h3>
            <p class="modal-subtitle">Incoming video call...</p>
            <div class="modal-actions" style="justify-content: center; gap: 30px; margin-top: 20px;">
                <button class="btn-secondary" id="rejectCallBtn" style="background: #ef4444; color: white; border-radius: 50%; width: 60px; height: 60px; padding: 0; border: none; display: flex; align-items: center; justify-content: center;"><i class="fas fa-phone-slash fa-lg"></i></button>
                <button class="btn-primary" id="acceptCallBtn" style="background: #10b981; color: white; border-radius: 50%; width: 60px; height: 60px; padding: 0; border: none; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite;"><i class="fas fa-phone fa-lg"></i></button>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>

    <!-- P2P + IndexedDB Libraries (must load before ES modules) -->
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <script type="module" src="../js/app.js"></script>
</body>
</html>
