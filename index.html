    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="description" content="Join Jchatt, the premium real-time messenger by JJ Coders. Send free messages and photos with high-end glassmorphism design. The best free WhatsApp alternative for web and mobile.">
    <meta name="keywords" content="Jchatt, Jchat, JJ Coders, Free Messenger, WhatsApp Alternative, Chat App, Real-time messaging, Web Chat, Mobile Messenger, Private Chat, Animated Messenger, No Download Chat">

    <!-- Social Media Previews -->
    <meta property="og:title" content="Jchatt - Premium Real-time Messaging | JJ Coders">
    <meta property="og:description" content="Experience Jchatt, the ultra-fast messenger with custom themes and mobile-first design. Built by JJ Coders for global connectivity.">

    <meta property="og:url" content="https://jchatt-your-url.web.app/">

    <meta name="twitter:title" content="Jchatt Messenger">
    <meta name="twitter:description" content="The sleekest free chat app on the web. Try Jchatt by JJ Coders.">

    <!-- Mobile App Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="/manifest.json?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="center-content theme-dark">
    <div class="loader-container">
        <div class="install-icon-wrapper" style="margin-bottom: 0;">
            <img src="/icon-512.png" alt="Jchatt" class="install-app-icon" style="width: 120px; height: 120px; margin-bottom: 20px;">
        </div>
        <div class="loader">Jchatt</div>
        <p>Connecting securely...</p>
    </div>

    <!-- PWA Install Modal -->
    <div id="pwaModal" class="modal">
        <div class="modal-content glass-card install-card">
            <div class="install-icon-wrapper">
                <img src="/icon-192.png" alt="Icon" class="install-app-icon">
            </div>
            <h3>Install Jchatt</h3>
            <p>Experience Jchatt without the browser bar. Fast, immersive, and works offline.</p>
            <button id="pwaInstallBtn" class="btn btn-primary" style="width: 100%; padding: 15px; font-weight: 600;">Install Now</button>
            <div id="pwaManualInstructions" style="display: none; margin-top: 15px; font-size: 0.85rem; padding: 10px; border-radius: 12px; background: rgba(0,0,0,0.2); text-align: left;">
                <p style="margin-bottom: 5px;"><strong>Manual Step:</strong></p>
                <ol style="padding-left: 15px; color: var(--text-secondary);">
                    <li>Tap the <strong>three dots</strong> (menu) or <strong>Share</strong> icon.</li>
                    <li>Select <strong>"Add to Home Screen"</strong> or <strong>"Install app"</strong>.</li>
                </ol>
            </div>
            <button id="pwaCancelBtn" class="btn btn-secondary" style="width: 100%; margin-top: 10px; opacity: 0.6;">Maybe Later</button>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        // PWA Install Logic
        let deferredPrompt;
        const pwaModal = document.getElementById('pwaModal');
        const pwaInstallBtn = document.getElementById('pwaInstallBtn');
        const pwaCancelBtn = document.getElementById('pwaCancelBtn');
        const pwaManualInstructions = document.getElementById('pwaManualInstructions');

        // Force show after 3 seconds for non-techies if the browser doesn't trigger prompt
        // This acts as a manual fallback for iOS and older Androids
        setTimeout(() => {
          if (!deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
            pwaModal.classList.add('show');
            pwaInstallBtn.style.display = 'none';
            pwaManualInstructions.style.display = 'block';
          }
        }, 3000);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            window.deferredPromptForApp = e; // Store for app.js
            pwaModal.classList.add('show');
            pwaInstallBtn.style.display = 'block';
            pwaManualInstructions.style.display = 'none';
        });

        pwaInstallBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    pwaModal.classList.remove('show');
                }
                deferredPrompt = null;
            } else {
              // Redirect to manual install guide if no prompt
              window.alert("Please use 'Add to Home Screen' from your browser menu to install Jchatt.");
            }
        });

        pwaCancelBtn.addEventListener('click', () => {
          pwaModal.classList.remove('show');
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=3').then(reg => {
                  console.log('Jchatt SW registered (P2P edition)');
                }).catch(err => console.log('SW registration failed:', err));
            });
        }

        // Redirect logic
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = '/feed/';
            } else {
                window.location.href = '/login/';
            }
        });

    </script>
</body>
</html>
