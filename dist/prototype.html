<!DOCTYPE html>

<!--
  JCHATT UI SPEC (for coding agents)
  ---------------------------------------------------------------
  One file, no dependencies. Two modes:
    1. "All screens": every screen rendered as a phone card with its route, purpose and tap targets.
    2. "Prototype":   click-through app (data-go navigates, data-back pops, data-act runs small behaviours).
  File map:
    CSS   1 tokens | 2 phone frame | 3 components | 4 board layout
    JS    1 icons + assets (faces, mascot Jay, illustrations, QR) | 2 data | 3 components
          4 SCREENS array (id, group, theme, tabs, purpose, taps, render) | 5 router + modes
  To port: each SCREENS[n].render() is one screen. Component helpers (av, rb, hdr, row, btn, chip, tog, sheet)
  map 1:1 to reusable native/web components. Design tokens live in :root.
  Product idea: privacy you can feel. Masks (a different identity per chat), Duress PIN (opens a decoy app),
  Nearby pairing (no phone number), Vault, Burn-after-reading timers, Screenshot shield, Local-only search.
-->

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

];
const BYID=Object.fromEntries(SCREENS.map(s=>[s.id,s]));
const TABS=[['chats','chat'],['updates','rec'],['calls','phone'],['shield','shield'],['settings','user']];
/* ===== JS 5. ROUTER + MODES ===== */
const S={mode:'board',stack:['splash']};const $=q=>document.querySelector(q);let pinBuf='',timer=0;
const statusBar=`<div class="sb"><span>9:41</span><svg width="46" height="12" viewBox="0 0 46 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="24" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="26" y="3" width="13" height="6" rx="1.5"/></svg></div>`;
const nav=id=>`<div class="nav">${TABS.map(t=>`<button data-go="${t[0]}" class="${t[0]==id?'on':''}" aria-label="${t[0]}">${ic(t[1],20)}</button>`).join('')}</div>`;
const phone=(sc,st)=>`<div class="phone ${sc.theme} ${st?'static':''}" data-screen="${sc.id}">${statusBar}${sc.render()}${sc.tabs?nav(sc.id):''}</div>`;
const board=()=>`<div class="bar"><h1>JChatt · UI spec</h1><button data-act="proto" data-id="splash" class="alt">Play prototype</button><button data-act="theme">Toggle dark page</button></div><div class="wrap"><h2>Product ideas<small>what makes it different</small></h2><div class="feat">${[['Masks','A different identity per chat. Contacts can never link you.'],['Duress PIN','A second PIN opens a harmless decoy app. Nothing is wiped.'],['Nearby pairing','Add people in person. No phone number, ever.'],['Burn after reading','Messages vanish the moment they are seen.'],['Local-only search','Search runs on-device. Nothing is uploaded.'],['Privacy streaks','Gamified shields, missions and XP keep habits strong.']].map(f=>`<div><b>${f[0]}</b><p>${f[1]}</p></div>`).join('')}</div>${GROUPS.map((g,gi)=>`<h2>${g[0]}<small>${g[1]}</small></h2><div class="grid">${SCREENS.filter(s=>s.group==gi).map(s=>`<div class="cardx">${phone(s,1)}<div class="cap"><b>${s.id}</b><code>/${s.id}</code><p>${s.purpose}</p><ul>${s.taps.map(t=>`<li>${t}</li>`).join('')}</ul><button data-act="proto" data-id="${s.id}">Open in prototype</button></div></div>`).join('')}</div>`).join('')}</div>`;
const proto=()=>{const sc=BYID[S.stack[S.stack.length-1]];return `<div class="bar"><h1>Prototype · ${sc.id}</h1><button data-act="board" class="alt">All screens</button></div><div class="proto">${phone(sc,0)}</div>`};
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)}
function render(){$('#app').innerHTML=S.mode=='board'?board():proto();clearTimeout(timer);const cur=S.stack[S.stack.length-1];if(S.mode=='proto'){const m=$('#msgs');if(m)m.scrollTop=1e5;if(cur=='splash')timer=setTimeout(()=>go('welcome-1'),2100)}}
function go(id){if(!BYID[id])return;const t=BYID[id];if(t.tabs||['splash','chats'].includes(id))S.stack=[id];else S.stack.push(id);pinBuf='';render()}
const ACT={proto:(b)=>{S.mode='proto';S.stack=[b.dataset.id];window.scrollTo(0,0);render()},board:()=>{S.mode='board';render()},theme:()=>{const d=document.documentElement;d.dataset.theme=getComputedStyle(d).colorScheme=='dark'?'light':'dark'},tg:b=>{const s=b.querySelector('.sw');if(s)s.classList.toggle('on');else b.classList.toggle('on')},toast:b=>toast(b.dataset.m||'Done'),
key:b=>{const k=b.dataset.k;pinBuf=k=='⌫'?pinBuf.slice(0,-1):(pinBuf+k).slice(0,4);document.querySelectorAll('#pin i').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length));if(pinBuf.length==4)go('vault')},
send:()=>{const i=document.querySelector('.comp input');if(!i||!i.value.trim())return toast('Voice notes are encrypted on-device');MSGS.push(['me',i.value.trim().replace(/</g,'&lt;'),'now']);render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-back],[data-act]');if(!b)return;if(b.closest('.static')&&!b.dataset.act)return;
if(b.dataset.act){ACT[b.dataset.act](b);if(b.dataset.go&&S.mode=='proto')go(b.dataset.go);return}
if(S.mode!='proto')return;if(b.hasAttribute('data-back')){if(S.stack.length>1){S.stack.pop();render()}else go('chats')}else go(b.dataset.go)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('.comp input'))ACT.send()});
render();
</script></body></html>
